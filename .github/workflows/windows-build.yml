name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build, test and package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ForgeDesk.sln

      - name: Unit tests
        run: >-
          dotnet test tests/ForgeDesk.Core.Tests/ForgeDesk.Core.Tests.csproj -c Release --no-restore
          --logger "trx;LogFileName=core-tests.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Publish portable app (self-contained, win-x64)
        run: >-
          dotnet publish src/ForgeDesk/ForgeDesk.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/ForgeDesk

      - name: Add portable readme and zip
        shell: pwsh
        run: |
          Copy-Item docs/PORTABLE-README.txt artifacts/ForgeDesk/README.txt
          Get-ChildItem artifacts/ForgeDesk | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          Compress-Archive -Path artifacts/ForgeDesk/* -DestinationPath artifacts/ForgeDesk-win-x64.zip -Force
          $hash = (Get-FileHash artifacts/ForgeDesk-win-x64.zip -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item artifacts/ForgeDesk-win-x64.zip).Length / 1MB, 1)
          "### ForgeDesk-win-x64.zip`n`nSize: $size MB  `nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload portable app
        uses: actions/upload-artifact@v6
        with:
          name: ForgeDesk-win-x64
          path: artifacts/ForgeDesk/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Ensure the WebView2 Runtime is installed
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id",
                    "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id",
                    "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id")
          $pv = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($pv) { Write-Host "WebView2 Runtime $pv is installed."; exit 0 }
          Write-Host 'Installing the WebView2 Runtime (Evergreen bootstrapper)...'
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process $setup -ArgumentList '/silent', '/install' -Wait

      - name: Smoke test (starts the real app on this Windows runner)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          $exe = Resolve-Path artifacts/ForgeDesk/ForgeDesk.exe
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $out) -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'The smoke test did not finish within 5 minutes.' }
          $report = Join-Path $out 'report.json'
          if (-not (Test-Path $report)) { Get-Content (Join-Path $out 'data/logs/forgedesk.log') -ErrorAction SilentlyContinue; throw "No report was written (exit code $($p.ExitCode))." }
          Get-Content $report | Write-Host
          Write-Host '--- log ---'
          Get-Content (Join-Path $out 'data/logs/forgedesk.log') -ErrorAction SilentlyContinue | Write-Host
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $lines = @("### Smoke test: $($r.info.result)", '', "WebView2 Runtime: $($r.info.webView2Runtime)", '', '| | Check | Detail |', '|---|---|---|')
          foreach ($c in $r.checks) {
            $mark = if ($c.passed) { 'pass' } elseif ($c.critical) { '**FAIL**' } else { 'note' }
            $lines += "| $mark | $($c.name) | $($c.detail) |"
          }
          $lines += ''
          $lines += '| Page (signed out) | Final page | HTTP | Title |'
          $lines += '|---|---|---|---|'
          foreach ($prop in $r.pages.PSObject.Properties) {
            $v = $prop.Value
            $lines += "| $($prop.Name) | $($v.finalPage) | $($v.httpStatus) | $($v.title) |"
          }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY
          exit $p.ExitCode

      - name: Upload smoke test report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results
          path: |
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/data/logs/
          if-no-files-found: ignore

      - name: Keep the release zip for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-zip
          path: artifacts/ForgeDesk-win-x64.zip

  release:
    name: Attach zip to GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ForgeDesk-win-x64.zip --repo "${GITHUB_REPOSITORY}" --title "ForgeDesk ${GITHUB_REF_NAME}" --notes "Portable Windows build. Requires the Microsoft Edge WebView2 Runtime (included with Windows 11)."
